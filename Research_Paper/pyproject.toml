[project]
name = "research-paper-implementations"
version = "0.1.0"
description = "From-scratch PyTorch implementations of ML research papers (Attention Is All You Need, RoFormer/RoPE, ...)"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # core numerics / DL
    "torch>=2.4",
    "numpy>=1.26",
    "einops>=0.8",
    # data handling
    "pandas>=2.2",
    "datasets>=2.20",
    "tokenizers>=0.20",
    "transformers>=4.44",
    # plots / analysis
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    # notebooks
    "jupyterlab>=4.2",
    "notebook>=7.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    # misc
    "tqdm>=4.66",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "nbstripout>=0.7",
]

[tool.uv]
# keep the venv inside this folder so every paper subproject shares one env
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are teaching material: grouped imports, throwaway lambdas and bare zip()
# keep the exposition short, and that matters more here than the style rule.
"*.ipynb" = ["E401", "E731", "B905", "I001"]
"**/test_*.py" = ["E731"]
